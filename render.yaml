services:
  - type: web
    name: master-oboev
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port 8080
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: DOMAIN
        sync: false
